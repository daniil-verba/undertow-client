[package]
name = "undertow-client"
version = "0.1.0"
edition = "2021"
authors = ["Daniil Verba <daniilverba123@gmail.com>"]
description = "Client terminal UI for Undertow P2P network"
license = "AGPL-3.0"
repository = "https://gitverse.ru/daniil-verba/undertow-client"

[[bin]]
name = "undertow"
path = "src/main.rs"

[dependencies]
undertow-protocol = { git = "https://gitverse.ru/daniil-verba/undertow-protocol", branch="dev", default-features = false, features = ["network", "storage"] }
tokio = { version = "1", features = ["full"] }

# UI dependencies (same versions as in protocol)
ratatui = "0.24"
crossterm = "0.27"
chrono = "0.4"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4" 
